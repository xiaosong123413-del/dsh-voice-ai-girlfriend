<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 女友 · 对话</title><link rel="stylesheet" href="/voice/static/style.css"></head><body><main>
<header><span class="eyebrow">陪伴 · VOICE</span><h1>聊一会儿</h1><p id="status" role="status" aria-live="polite">点击开始，连接对话</p></header>
<section class="stage" aria-label="视频对话"><video id="video-a" playsinline preload="auto"></video><video id="video-b" playsinline preload="auto" hidden></video><div id="empty">从一句话开始</div><button id="resume" hidden>点此播放声音和视频</button></section>
<div class="controls"><button id="start">开始</button><button id="mic" disabled aria-pressed="false">麦克风关</button><button id="end" disabled>结束</button></div>
<label class="mode">收音方式<select id="mode"><option value="queue">播放时暂停收音</option><option value="barge">允许说话打断</option></select></label>
<section id="transcript" class="transcript" aria-label="对话记录" aria-live="polite"></section>
<form id="message"><label for="text">发送文字</label><div class="composer"><textarea id="text" rows="2" maxlength="4000" placeholder="想说些什么…" disabled></textarea><button id="send" disabled>发送</button></div></form>
<p class="footnote">退出页面或断网会停止收音与播放。重新开始需要点击按钮。</p>
</main><script type="module" src="/voice/static/app.js"></script></body></html>
